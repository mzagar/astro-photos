<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Astro Photos</title>
  <meta name="description" content="Moje obrađene astrofotografije snimljene teleskopom Seestar S50 Pro.">
  <style>
    :root {
      --bg: #0a0c11;
      --bg-soft: #11151d;
      --card: #161b25;
      --fg: #e9edf5;
      --muted: #8b93a7;
      --accent: #7fb0ff;
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0 20px 60px;
      background: radial-gradient(1200px 600px at 50% -200px, #1a2333 0%, var(--bg) 60%) no-repeat, var(--bg);
      color: var(--fg);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body.locked { overflow: hidden; }

    header {
      max-width: 1200px;
      margin: 0 auto;
      padding: 56px 0 32px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
      letter-spacing: 0.02em;
    }

    .grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
      gap: 16px;
      align-items: start;
    }

    .tile {
      display: block;
      width: 100%;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: var(--radius);
      background: var(--card);
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: zoom-in;
      overflow: hidden;
      transition: transform 0.18s ease, border-color 0.18s ease;
    }

    .tile:hover,
    .tile:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(127, 176, 255, 0.45);
      outline: none;
    }

    .tile img {
      display: block;
      width: 100%;
      height: auto;
      background: var(--bg-soft);
    }

    .tile .cap {
      display: block;
      padding: 10px 12px 12px;
    }

    .tile .title {
      display: block;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .tile .meta {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .empty {
      max-width: 1200px;
      margin: 40px auto;
      padding: 24px;
      border: 1px dashed rgba(255, 255, 255, 0.12);
      border-radius: var(--radius);
      color: var(--muted);
      text-align: center;
    }

    footer {
      max-width: 1200px;
      margin: 56px auto 0;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
    }

    /* Lightbox */
    .lightbox[hidden] { display: none; }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 24px;
      overflow-y: auto;
      background: rgba(4, 6, 10, 0.94);
      backdrop-filter: blur(6px);
    }

    .lightbox figure {
      margin: auto;
      width: 100%;
      max-width: min(1400px, 100%);
      text-align: center;
    }

    .lb-media {
      display: block;
      max-width: 100%;
      margin: 0 auto;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: none;
      cursor: zoom-in;
      line-height: 0;
    }

    .lb-media:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    .lb-media img {
      display: block;
      max-width: 100%;
      max-height: 70vh;
      width: auto;
      height: auto;
      margin: 0 auto;
      border-radius: 8px;
      background: var(--bg-soft);
    }

    .lightbox figcaption {
      margin-top: 14px;
      color: var(--fg);
      font-size: 0.9rem;
    }

    .lb-title {
      font-weight: 600;
      font-size: 1.02rem;
    }

    .lb-metadata,
    .lb-text {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 0.84rem;
    }

    .lb-text { max-width: 60ch; margin-inline: auto; }

    .lb-hint {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 0.75rem;
    }

    .lightbox > button {
      position: absolute;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      background: rgba(22, 27, 37, 0.85);
      color: var(--fg);
      font-size: 1.4rem;
      line-height: 1;
      cursor: pointer;
    }

    .lightbox > button:hover { border-color: var(--accent); }

    .lightbox > button[hidden] { display: none; }

    .lb-close { top: 18px; right: 18px; }
    .lb-prev { left: 18px; top: 50%; margin-top: -22px; }
    .lb-next { right: 18px; top: 50%; margin-top: -22px; }

    /* Fullscreen zoom */
    .zoom[hidden] { display: none; }

    .zoom {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #05070b;
      touch-action: none;
    }

    .zoom img {
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
      transform-origin: 50% 50%;
      will-change: transform;
      cursor: grab;
      user-select: none;
      -webkit-user-drag: none;
    }

    .zoom.dragging img { cursor: grabbing; }

    .zoom-bar {
      position: absolute;
      top: 14px;
      left: 50%;
      z-index: 1;
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 5px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      background: rgba(16, 20, 28, 0.88);
      transform: translateX(-50%);
    }

    .zoom-bar button {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 50%;
      background: none;
      color: var(--fg);
      font: inherit;
      font-size: 1.05rem;
      line-height: 1;
      cursor: pointer;
    }

    .zoom-bar button:hover { border-color: rgba(127, 176, 255, 0.5); }

    .zoom-label {
      min-width: 58px;
      color: var(--muted);
      font-size: 0.78rem;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    @media (max-width: 600px) {
      body { padding: 0 12px 40px; }
      header { padding: 36px 0 24px; }
      .grid { grid-template-columns: 1fr; gap: 12px; }
      .lightbox { padding: 12px; }
      .lb-media img { max-height: 58vh; }
      .lb-prev, .lb-next { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1 id="site-title">Astro Photos</h1>
    <p id="site-subtitle">Seestar S50 Pro</p>
  </header>

  <main class="grid" id="grid"></main>

  <footer id="site-footer"></footer>

  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Pregled slike">
    <button class="lb-close" type="button" aria-label="Zatvori">×</button>
    <button class="lb-prev" type="button" aria-label="Prethodna">‹</button>
    <button class="lb-next" type="button" aria-label="Sljedeća">›</button>
    <figure>
      <button class="lb-media" type="button" aria-label="Puna veličina i zumiranje">
        <img id="lb-img" alt="">
      </button>
      <figcaption id="lb-caption"></figcaption>
    </figure>
  </div>

  <div class="zoom" id="zoom" hidden role="dialog" aria-modal="true" aria-label="Puna slika">
    <div class="zoom-bar">
      <button type="button" id="zoom-out" aria-label="Umanji">−</button>
      <span class="zoom-label" id="zoom-label">100 %</span>
      <button type="button" id="zoom-in" aria-label="Uvećaj">+</button>
      <button type="button" id="zoom-reset" aria-label="Vrati na početno">1:1</button>
      <button type="button" id="zoom-close" aria-label="Zatvori punu sliku">×</button>
    </div>
    <img id="zoom-img" alt="">
  </div>

  <script src="gallery-data.js"></script>
  <script>
    (function () {
      'use strict';

      var data = window.GALLERY_DATA || {};
      var site = data.site || {};
      var photos = Array.isArray(data.photos) ? data.photos : [];

      var grid = document.getElementById('grid');
      var lightbox = document.getElementById('lightbox');
      var lbMedia = document.querySelector('.lb-media');
      var lbImg = document.getElementById('lb-img');
      var lbCaption = document.getElementById('lb-caption');
      var btnClose = document.querySelector('.lb-close');
      var btnPrev = document.querySelector('.lb-prev');
      var btnNext = document.querySelector('.lb-next');

      var zoomEl = document.getElementById('zoom');
      var zoomImg = document.getElementById('zoom-img');
      var zoomLabel = document.getElementById('zoom-label');

      var current = -1;

      function setText(id, value) {
        if (!value) return;
        document.getElementById(id).textContent = value;
      }

      setText('site-title', site.title);
      setText('site-subtitle', site.subtitle);
      setText('site-footer', site.footer);
      if (site.title) document.title = site.title;

      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text != null) node.textContent = text;
        return node;
      }

      if (!photos.length) {
        grid.innerHTML = '<p class="empty">Još nema slika. Dodaj obrade u <code>masters/</code> i pokreni <code>python3 scripts/build_gallery.py</code>.</p>';
        return;
      }

      photos.forEach(function (photo, index) {
        var tile = el('button', 'tile');
        tile.type = 'button';

        var img = el('img');
        img.src = photo.thumb || photo.file;
        img.alt = photo.title || '';
        img.loading = 'lazy';
        img.decoding = 'async';
        if (photo.width) img.width = photo.width;
        if (photo.height) img.height = photo.height;

        var caption = el('span', 'cap');
        caption.append(
          el('span', 'title', photo.title || ''),
          el('span', 'meta', photo.date || '')
        );
        tile.append(img, caption);
        tile.addEventListener('click', function () { open(index); });
        grid.append(tile);
      });

      function render(index) {
        var photo = photos[index];
        if (!photo) return;
        current = index;

        lbImg.src = photo.file;
        lbImg.alt = photo.title || '';

        lbCaption.textContent = '';
        lbCaption.append(el('div', 'lb-title', photo.title || ''));
        if (photo.date) lbCaption.append(el('div', 'lb-metadata', photo.date));
        if (photo.caption) lbCaption.append(el('p', 'lb-text', photo.caption));
        lbCaption.append(el('p', 'lb-hint', 'Klikni sliku za punu veličinu i zumiranje'));

        var single = photos.length < 2;
        btnPrev.hidden = single;
        btnNext.hidden = single;
      }

      function open(index) {
        render(index);
        lightbox.hidden = false;
        document.body.classList.add('locked');
        btnClose.focus();
      }

      function close() {
        lightbox.hidden = true;
        lbImg.removeAttribute('src');
        document.body.classList.remove('locked');
        current = -1;
      }

      function step(delta) {
        if (current < 0) return;
        render((current + delta + photos.length) % photos.length);
      }

      /* ---------- fullscreen zoom ---------- */

      var MIN_SCALE = 1;
      var MAX_SCALE = 12;
      var scale = 1;
      var offsetX = 0;
      var offsetY = 0;
      var pointers = new Map();
      var pressPoint = null;
      var moved = false;
      var lastTap = 0;
      var suppressClickUntil = 0;

      function applyTransform() {
        zoomImg.style.transform = 'translate(' + offsetX + 'px, ' + offsetY + 'px) scale(' + scale + ')';
        zoomLabel.textContent = Math.round(scale * 100) + ' %';
      }

      function resetZoom() {
        scale = 1;
        offsetX = 0;
        offsetY = 0;
        applyTransform();
      }

      function zoomAt(clientX, clientY, factor) {
        var next = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale * factor));
        if (next === scale) return;
        var ratio = next / scale;
        var rect = zoomImg.getBoundingClientRect();
        offsetX += (1 - ratio) * (clientX - (rect.left + rect.width / 2));
        offsetY += (1 - ratio) * (clientY - (rect.top + rect.height / 2));
        scale = next;
        if (scale === MIN_SCALE) {
          offsetX = 0;
          offsetY = 0;
        }
        applyTransform();
      }

      function openZoom() {
        var photo = photos[current];
        if (!photo) return;
        zoomImg.src = photo.file;
        zoomImg.alt = photo.title || '';
        zoomEl.hidden = false;
        document.body.classList.add('locked');
        resetZoom();
        document.getElementById('zoom-close').focus();
      }

      function closeZoom() {
        zoomEl.hidden = true;
        zoomImg.removeAttribute('src');
        pointers.clear();
        pressPoint = null;
        moved = false;
        resetZoom();
        if (lightbox.hidden) document.body.classList.remove('locked');
        lbMedia.focus();
      }

      function pinchState() {
        var points = Array.from(pointers.values());
        if (points.length < 2) return null;
        var dx = points[0].x - points[1].x;
        var dy = points[0].y - points[1].y;
        return {
          distance: Math.sqrt(dx * dx + dy * dy) || 1,
          x: (points[0].x + points[1].x) / 2,
          y: (points[0].y + points[1].y) / 2
        };
      }

      zoomEl.addEventListener('pointerdown', function (event) {
        if (event.target.closest('.zoom-bar')) return;
        if (pointers.size === 0) {
          pressPoint = { x: event.clientX, y: event.clientY };
          moved = false;
        }
        pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
        zoomEl.classList.add('dragging');
        if (zoomEl.setPointerCapture) zoomEl.setPointerCapture(event.pointerId);
        event.preventDefault();
      });

      zoomEl.addEventListener('pointermove', function (event) {
        var previous = pointers.get(event.pointerId);
        if (!previous) return;
        var before = pointers.size >= 2 ? pinchState() : null;
        pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

        if (pointers.size >= 2) {
          var after = pinchState();
          if (before && after) {
            offsetX += after.x - before.x;
            offsetY += after.y - before.y;
            applyTransform();
            zoomAt(after.x, after.y, after.distance / before.distance);
          }
          moved = true;
          return;
        }

        offsetX += event.clientX - previous.x;
        offsetY += event.clientY - previous.y;
        if (pressPoint) {
          var travel = Math.abs(event.clientX - pressPoint.x) + Math.abs(event.clientY - pressPoint.y);
          if (travel > 6) moved = true;
        }
        applyTransform();
      });

      function endPointer(event) {
        var point = pointers.get(event.pointerId);
        if (!point) return;
        pointers.delete(event.pointerId);
        if (pointers.size > 0) return;

        zoomEl.classList.remove('dragging');
        var tapped = !moved && pressPoint && Math.abs(point.x - pressPoint.x) + Math.abs(point.y - pressPoint.y) <= 6;
        var now = Date.now();
        if (tapped && now - lastTap < 320) {
          if (scale > MIN_SCALE + 0.01) resetZoom();
          else zoomAt(point.x, point.y, 2.5);
          lastTap = 0;
          suppressClickUntil = now + 400;
        } else {
          lastTap = tapped ? now : 0;
        }
        pressPoint = null;
      }

      zoomEl.addEventListener('pointerup', endPointer);
      zoomEl.addEventListener('pointercancel', endPointer);

      zoomEl.addEventListener('wheel', function (event) {
        event.preventDefault();
        zoomAt(event.clientX, event.clientY, Math.exp(-event.deltaY * 0.0025));
      }, { passive: false });

      zoomEl.addEventListener('click', function (event) {
        if (event.target.closest('.zoom-bar')) return;
        if (moved || Date.now() < suppressClickUntil) return;
        if (event.target !== zoomEl) return;
        closeZoom();
      });

      document.getElementById('zoom-in').addEventListener('click', function () {
        zoomAt(window.innerWidth / 2, window.innerHeight / 2, 1.5);
      });
      document.getElementById('zoom-out').addEventListener('click', function () {
        zoomAt(window.innerWidth / 2, window.innerHeight / 2, 1 / 1.5);
      });
      document.getElementById('zoom-reset').addEventListener('click', resetZoom);
      document.getElementById('zoom-close').addEventListener('click', closeZoom);

      /* ---------- wiring ---------- */

      lbMedia.addEventListener('click', openZoom);
      lightbox.addEventListener('click', function (event) {
        if (event.target === lightbox) close();
      });
      btnClose.addEventListener('click', close);
      btnPrev.addEventListener('click', function () { step(-1); });
      btnNext.addEventListener('click', function () { step(1); });

      document.addEventListener('keydown', function (event) {
        if (!zoomEl.hidden) {
          if (event.key === 'Escape') {
            event.preventDefault();
            closeZoom();
          } else if (event.key === '+' || event.key === '=') {
            zoomAt(window.innerWidth / 2, window.innerHeight / 2, 1.4);
          } else if (event.key === '-') {
            zoomAt(window.innerWidth / 2, window.innerHeight / 2, 1 / 1.4);
          } else if (event.key === '0') {
            resetZoom();
          }
          return;
        }
        if (lightbox.hidden) return;
        if (event.key === 'Escape') close();
        else if (event.key === 'ArrowLeft') step(-1);
        else if (event.key === 'ArrowRight') step(1);
      });
    })();
  </script>
</body>
</html>
